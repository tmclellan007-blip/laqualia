<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Invitation · La Qualia</title>
<meta name="theme-color" content="#04081a">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="compte.css?v=2">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><img src="../assets/icone-clair.svg" alt="" width="30" height="30">La Qualia <small>Invitation</small></a>
</header>
<main class="auth">
  <section class="sheet" aria-labelledby="t" aria-live="polite">
    <h1 id="t">Invitation</h1>
    <div id="body"><div class="skel"></div><div class="skel" style="width:70%"></div></div>
  </section>
</main>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Le jeton est dans le fragment (#…) : il n'est jamais envoyé dans les journaux du serveur ni au fournisseur de connexion.
  let token = location.hash.slice(1);
  try {
    if (token) { sessionStorage.setItem("lq-invite", token); history.replaceState(null, "", location.pathname); }
    else token = sessionStorage.getItem("lq-invite") || "";
  } catch {}
  const FN = { reception: "Réception", tsa: "TSA", veterinarian: "Vétérinaire", manager: "Gestion", other: "Autre" };
  const show = (html) => ($("body").innerHTML = html);
  const done = () => { try { sessionStorage.removeItem("lq-invite"); } catch {} };
  if (!/^[\w-]{20,}$/.test(token)) { show('<div class="notice err">Ce lien d\'invitation est incomplet. Ouvrez le lien exact reçu de votre établissement.</div>'); return; }
  const STATES = { used: "Cette invitation a déjà été utilisée.", revoked: "Cette invitation a été révoquée par l'établissement.", expired: "Cette invitation a expiré. Demandez-en une nouvelle à votre responsable.", invalid: "Invitation introuvable." };
  Promise.all([fetch("/api/invitations/" + token).then((r) => r.json().catch(() => ({ state: "invalid" }))), fetch("/api/me").then((r) => (r.ok ? r.json() : null))])
    .then(([inv, me]) => {
      if (inv.state !== "pending") { done(); show(`<div class="notice err">${esc(STATES[inv.state] || STATES.invalid)}</div><a class="btn ghost" href="./">Retour</a>`); return; }
      const what = `<p>Vous êtes invité(e) à rejoindre <b>${esc(inv.orgName)}</b> comme <b>${esc(inv.roleLabel)}</b> (fonction : ${esc(FN[inv.function] || inv.function)}).</p>
        <p class="fine">Destinataire : ${esc(inv.emailHint)} · valable jusqu'au ${new Date(inv.expiresAt).toLocaleDateString("fr-CA", { day: "numeric", month: "long", year: "numeric" })}</p>`;
      if (!me) { show(what + `<p>Connectez-vous avec le compte qui utilise cette adresse, ou recevez un code de connexion à cette adresse.</p><a class="btn" href="connexion.html?suite=${encodeURIComponent("/agent/invitation.html")}">Se connecter pour accepter</a>`); return; }
      show(what + `<div class="row"><button class="btn" id="ok">Accepter l'invitation</button><a class="btn ghost" href="compte.html">Plus tard</a></div><div id="msg"></div>`);
      $("ok").onclick = async () => {
        $("ok").disabled = true;
        const r = await fetch("/api/invitations/" + token + "/accept", { method: "POST", headers: { "x-lq-csrf": "1" } });
        const d = await r.json().catch(() => ({}));
        if (r.ok) { done(); show(`<div class="notice ok">Bienvenue dans ${esc(d.orgName)} !</div><a class="btn" href="compte.html#etablissement">Ouvrir mon établissement</a>`); return; }
        $("ok").disabled = false;
        let extra = "";
        if (d.code === "email_mismatch") extra = `<p class="fine" style="margin-top:8px">Adresses de votre compte : ${(d.yourEmails || []).map((e) => esc(e.email || "—") + (e.private ? " (adresse masquée Apple)" : "")).join(", ")}. Si l'adresse invitée est bien la vôtre, associez-la à ce compte depuis <a href="compte.html#profil">Mon profil</a> (un code vous sera envoyé), puis revenez ici. Sinon, demandez une invitation à l'une de ces adresses.</p>`;
        if (/invitation_/.test(d.code || "")) done();
        $("msg").innerHTML = `<div class="notice err" role="alert">${esc(d.error || "L'invitation n'a pas pu être acceptée.")}</div>` + extra;
      };
    })
    .catch(() => show('<div class="notice err">Le service est momentanément indisponible. Réessayez.</div>'));
})();
</script>
</body>
</html>
