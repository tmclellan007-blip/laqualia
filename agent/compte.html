<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mon compte · La Qualia</title>
<meta name="theme-color" content="#04081a">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="compte.css?v=1">
</head>
<body>
<a class="sr" href="#main">Aller au contenu</a>
<header class="topbar">
  <a class="brand" href="./"><img src="../assets/icone-clair.svg" alt="" width="30" height="30">La Qualia <small>Mon compte</small></a>
  <span class="sp"></span>
  <a class="tlink" href="./">Retour à l'assistant</a>
  <span class="chip-user" id="chip" hidden><span class="av" id="chipAv" aria-hidden="true"></span><span id="chipName"></span></span>
  <button class="tlink" id="logout" type="button" hidden>Se déconnecter</button>
</header>
<div class="layout">
  <aside class="side" aria-label="Navigation du compte">
    <div class="orgpick" id="orgpick" hidden>
      <label for="orgSel">Établissement</label>
      <select id="orgSel"></select>
    </div>
    <nav class="nav" id="nav">
      <a href="#profil" data-r="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>Mon profil</a>
      <a href="#etablissement" data-r="etablissement"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18M5 21V9l7-5 7 5v12M10 21v-6h4v6"/></svg>Mon établissement</a>
      <a href="#membres" data-r="membres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20c0-2.6-1.4-4.6-3.5-5.5"/></svg>Membres et invitations</a>
      <a href="#roles" data-r="roles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Rôles et permissions</a>
      <span class="sep" id="platSep" hidden></span>
      <a href="#plateforme" data-r="plateforme" id="navPlat" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>Plateforme</a>
    </nav>
  </aside>
  <main id="main" tabindex="-1" aria-live="polite">
    <div class="cards"><div class="card"><div class="skel"></div><div class="skel" style="width:60%"></div><div class="skel" style="width:80%"></div></div></div>
  </main>
</div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<script src="compte.js?v=1"></script>
</body>
</html>
